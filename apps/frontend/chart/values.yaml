# ───────────────────────────────
# Chart / Naming
# ───────────────────────────────
nameOverride: "" 
fullnameOverride: ""

# ───────────────────────────────
# Deployment / Scaling
# ───────────────────────────────
# TODO: Change this to HPA
replicaCount: 1

# ───────────────────────────────
# Image & Registry
# ───────────────────────────────
image:
  repository: docker.io/frantkich/devops-training-frontend-app
  pullPolicy: Always
  # TODO: Change this to fix version
  tag: latest

imagePullSecrets: []

# ───────────────────────────────
# Application Configuration
# ───────────────────────────────
app:
  env:
    # TODO: Change this to prod
    - name: FLASK_DEBUG
      value: "1"
    - name: BACKEND_URL
      value: https://devops-training.api.frantkich.fr:30443
  args:
    - "--workers=2"
    - "--bind=0.0.0.0:8000"
    - "main:app"
# ───────────────────────────────
# Pod Configuration
# ───────────────────────────────
podAnnotations: {}
podLabels: 
  app: frontend

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: "RuntimeDefault"
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http-python
readinessProbe:
  httpGet:
    path: /healthz
    port: http-python

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

# ───────────────────────────────
# Networking
# ───────────────────────────────
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-dns"
  hosts:
    - host: devops-training.frantkich.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
      - devops-training.frantkich.fr
      secretName: devops-training-frontend-tls
